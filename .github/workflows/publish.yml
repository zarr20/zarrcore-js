name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        registry-url: 'https://registry.npmjs.org'
        
    - name: Check dist exists
      id: check-dist
      run: |
        if [ -d "dist" ] && [ "$(ls -A dist)" ]; then
          echo "dist_exists=true" >> $GITHUB_OUTPUT
        else
          echo "dist_exists=false" >> $GITHUB_OUTPUT
        fi
      shell: bash
        
    - name: Install dependencies
      if: steps.check-dist.outputs.dist_exists == 'false'
      run: npm ci
      
    - name: Build package
      if: steps.check-dist.outputs.dist_exists == 'false'
      run: npm run build
      
    - name: Publish to NPM
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
