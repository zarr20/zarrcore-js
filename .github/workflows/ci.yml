name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write
  id-token: write

env:
  NODE_VERSION: "20.x"

jobs:
  # ==========================================
  # MAIN CI
  # ==========================================
  ci:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # SETUP NODE
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm

      # ==========================================
      # INSTALL
      # ==========================================
      - name: Install dependencies
        run: npm ci

      # ==========================================
      # LINT
      # ==========================================
      - name: Run lint
        run: npm run lint --if-present

      # ==========================================
      # TYPE CHECK
      # ==========================================
      - name: Run type check
        run: npm run typecheck --if-present

      # ==========================================
      # TEST
      # ==========================================
      - name: Run tests
        run: npm test --if-present

      # ==========================================
      # BUILD
      # ==========================================
      - name: Build package
        run: npm run build --if-present

      # ==========================================
      # NPM AUDIT
      # ==========================================
      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      # ==========================================
      # TRUFFLEHOG SECURITY SCAN
      # ==========================================
      # - name: Security scan (TruffleHog)
      #   uses: trufflesecurity/trufflehog@main
      #   with:
      #     extra_args: --results=verified,unknown

  # ==========================================
  # REUSABLE SECURITY WORKFLOW
  # ==========================================
  security_workflow:
    needs: ci
    uses: ./.github/workflows/security.yml

  # ==========================================
  # PUBLISH NPM
  # ==========================================
  publish:
    needs:
      - ci
      - security_workflow

    runs-on: ubuntu-latest

    if: |
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push'

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # SETUP NODE
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      # ==========================================
      # INSTALL
      # ==========================================
      - name: Install dependencies
        run: npm ci

      # ==========================================
      # BUILD
      # ==========================================
      - name: Build package
        run: npm run build --if-present

      # ==========================================
      # PUBLISH
      # ==========================================
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}