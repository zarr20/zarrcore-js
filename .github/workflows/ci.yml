name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

  install:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm install

  test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Run tests
        run: npm test

  audit:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  scan_dist:
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - name: Scan dist for secrets
        run: |
          echo "Scanning dist for secret patterns..."
          grep -i -E "secret|password|apikey|token" -r ./dist || echo "No secrets found"

  security_scan:
    runs-on: ubuntu-latest
    needs: scan_dist
    steps:
      - name: Security scan (trufflehog)
        uses: trufflesecurity/trufflehog@v3
        with:
          path: .

  security_workflow:
    runs-on: ubuntu-latest
    needs: security_scan
    steps:
      - name: Run security workflow
        uses: ./.github/workflows/security.yml

  publish:
    runs-on: ubuntu-latest
    needs: security_workflow
    if: success()
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > .npmrc
          npm publish
